stages:
  prepare:
    cmd: >-
      uv run python ${workdir}/data_processing/process.py
      --input ${data.raw_dir}
      --output ${data.processed_dir}
      --nltk ${data.nltk_dir}
    deps:
    - ${workdir}/data_processing/process.py
    - ${data.raw_dir}/ag_news_train.csv
    - ${data.raw_dir}/ag_news_test.csv
    - ${data.nltk_dir}
    outs:
    - ${data.processed_dir}/ag_news_proc.parquet
    params:
    - data.raw_dir
    - data.processed_dir
    - data.nltk_dir
  split:
    cmd: >-
      uv run python ${workdir}/data_processing/split.py
      --datadir ${data.processed_dir}
    deps:
    - ${workdir}/data_processing/split.py
    - ${data.processed_dir}/ag_news_proc.parquet
    outs:
    - ${data.processed_dir}/train.parquet
    - ${data.processed_dir}/test.parquet
    params:
    - random_state
    - data.processed_dir
    - data.test_size
  featurize:
    cmd: >-
      uv run python ${workdir}/data_processing/feature_extraction.py
      --datadir ${data.processed_dir}
    deps:
    - ${workdir}/data_processing/feature_extraction.py
    - ${data.processed_dir}/train.parquet
    - ${data.processed_dir}/test.parquet
    outs:
    - ${data.processed_dir}/vectorizer.joblib
    - ${data.processed_dir}/X_train.npz
    - ${data.processed_dir}/X_test.npz
    params:
    - data.processed_dir
    - features
  train:
    cmd: >-
      uv run python ${workdir}/model_training/train.py
      --datadir ${data.processed_dir}
      --out ${output.dir}
    deps:
    - ${workdir}/model_training/train.py
    - ${data.processed_dir}/X_train.npz
    - ${data.processed_dir}/train.parquet
    outs:
    - ${output.dir}/${model.name}.joblib
    params:
    - random_state
    - data.processed_dir
    - model
    - output.dir
  evaluation:
    cmd: >-
      uv run python ${workdir}/model_training/evaluation.py
      --datadir ${data.processed_dir}
      --modeldir ${output.dir}
      --out ${output.dir}
    deps:
    - ${workdir}/model_training/evaluation.py
    - ${data.processed_dir}/X_test.npz
    - ${data.processed_dir}/test.parquet
    - ${output.dir}/${model.name}.joblib
    outs:
    - ${output.dir}/${model.name}_report.csv
    params:
    - data.processed_dir
    - model.name
    - output.dir
