stages:
  prepare:
    cmd: >-
      uv run python src/text_classification/data_processing/process.py
      --input ${data.raw_dir}
      --output ${data.processed_dir}
      --nltk ${data.nltk_dir}
    deps:
    - src/text_classification/data_processing/process.py
    - ${data.raw_dir}/ag_news_train.csv
    - ${data.raw_dir}/ag_news_test.csv
    outs:
    - ${data.processed_dir}/ag_news_proc.parquet
    params:
    - data.raw_dir
