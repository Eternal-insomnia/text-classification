workdir: "src/text_classification"
random_state: 42

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  nltk_dir: "data/nltk"
  test_size: 0.2

features:
  max_features: 10000
  ngram_range: [1, 2]
  sublinear_tf: true

model:
  name: "logreg"
  c: 1.0
  max_iter: 1000

output:
  dir: "outputs/report"