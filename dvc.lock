schema: '2.0'
stages:
  prepare:
    cmd: uv run python src/text_classification/data_processing/process.py 
      --input data/raw --output data/processed --nltk data/nltk
    deps:
    - path: data/raw/ag_news_test.csv
      hash: md5
      md5: 2a3ae7ef5a1ac5563600b0bb18cffc47
      size: 1822708
    - path: data/raw/ag_news_train.csv
      hash: md5
      md5: 9614e8adbb88bf9abf40ae9a7946f2f6
      size: 28924927
    - path: src/text_classification/data_processing/process.py
      hash: md5
      md5: e0d3be8f983ee2527c095ff06fcf691e
      size: 6117
    params:
      params.yaml:
        data.nltk_dir: data/nltk
        data.processed_dir: data/processed
        data.raw_dir: data/raw
    outs:
    - path: data/processed/ag_news_proc.parquet
      hash: md5
      md5: 9042f4b168736af4beaa8f4cc5b0ff2a
      size: 13826743
  split:
    cmd: uv run python src/text_classification/data_processing/split.py 
      --datadir data/processed
    deps:
    - path: data/processed/ag_news_proc.parquet
      hash: md5
      md5: 9042f4b168736af4beaa8f4cc5b0ff2a
      size: 13826743
    - path: src/text_classification/data_processing/split.py
      hash: md5
      md5: 9eebef89b41dc9b06c7be93fd7f083e8
      size: 821
    params:
      params.yaml:
        data.random_state: 42
        data.test_size: 0.2
    outs:
    - path: data/processed/test.parquet
      hash: md5
      md5: 463ab0654914645a422ac218d2eb7e68
      size: 3025635
    - path: data/processed/train.parquet
      hash: md5
      md5: a3c38d3ce99a541c4e990724adce1198
      size: 12068488
  featurize:
    cmd: uv run python 
      src/text_classification/data_processing/feature_extraction.py --datadir 
      data/processed
    deps:
    - path: data/processed/test.parquet
      hash: md5
      md5: 463ab0654914645a422ac218d2eb7e68
      size: 3025635
    - path: data/processed/train.parquet
      hash: md5
      md5: a3c38d3ce99a541c4e990724adce1198
      size: 12068488
    - path: src/text_classification/data_processing/feature_extraction.py
      hash: md5
      md5: aa145ea616a6a9d720ab8186554ac9ab
      size: 1181
    params:
      params.yaml:
        features:
          max_features: 10000
          ngram_range:
          - 1
          - 2
          sublinear_tf: true
    outs:
    - path: data/processed/X_test.npz
      hash: md5
      md5: 3afa354ce9f099f7fb461bcb22dd2ae2
      size: 5320845
    - path: data/processed/X_train.npz
      hash: md5
      md5: a886d30386d6c0f0981cc2e2c22a36c4
      size: 21661869
    - path: data/processed/vectorizer.joblib
      hash: md5
      md5: d54d5d4c7db84f9da97e560a25e76167
      size: 383728
